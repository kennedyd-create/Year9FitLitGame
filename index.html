<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Map — Year 9 Financial Literacy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..900&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#ecdfc0;
    --paper-2:#fbf6e9;
    --paper-3:#ddcba2;
    --line:#7c6a44;
    --ink:#201a0d;
    --ink-mute:#5b5238;
    --brand-navy:#002066;
    --brand-navy-deep:#00112e;
    --brand-navy-line:#00112e;
    --navy:#002066;
    --navy-soft:#d1e6f6;
    --mod-a:#166a4f;   /* Money & the Wider World */
    --mod-b:#59327b;   /* Plan It Out */
    --mod-c:#a1221e;   /* Expect the Unexpected */
    --mod-w:#226477;   /* Spread the Word */
    --gold:#c5a059;
    --gold-text:#8b6508;
    --gold-soft:#f5ead2;
    --wine:#8c2415;
    --wine-soft:#f2d7ce;
    --good:#0f6b3f;
    --good-soft:#cdeadb;
    --shadow:rgba(27,20,10,.24);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0d1510; --paper-2:#182619; --paper-3:#243423;
      --line:#63765c; --ink:#f4ecd6; --ink-mute:#adbca4;
      --navy:#8ec2ec; --navy-soft:#1b2c38;
      --brand-navy:#123a8f; --brand-navy-deep:#05173d; --brand-navy-line:#3d6fe0;
      --mod-a:#6adfb3; --mod-b:#bf98e1; --mod-c:#ee7664; --mod-w:#90c6d5;
      --gold:#d4b378; --gold-text:#e8c98a; --gold-soft:#2c2410;
      --wine:#ec9280; --wine-soft:#331d16; --good:#8be9b8; --good-soft:#123322;
      --shadow:rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0d1510; --paper-2:#182619; --paper-3:#243423;
    --line:#63765c; --ink:#f4ecd6; --ink-mute:#adbca4;
    --navy:#8ec2ec; --navy-soft:#1b2c38;
    --brand-navy:#123a8f; --brand-navy-deep:#05173d; --brand-navy-line:#3d6fe0;
    --mod-a:#6adfb3; --mod-b:#bf98e1; --mod-c:#ee7664; --mod-w:#90c6d5;
    --gold:#d4b378; --gold-text:#e8c98a; --gold-soft:#2c2410;
    --wine:#ec9280; --wine-soft:#331d16; --good:#8be9b8; --good-soft:#123322;
    --shadow:rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html{color-scheme:light dark;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
    padding:20px 16px 48px; display:flex; justify-content:center;
  }
  .num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
  h1,h2,h3,.display{font-family:'Fraunces',Georgia,serif;font-weight:800;text-wrap:balance;}
  .wrap{width:100%;max-width:900px;display:flex;flex-direction:column;gap:14px;}
  button{font-family:inherit;}
  button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{
    outline:3px solid var(--navy);outline-offset:2px;
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important;} }

  .masthead{
    border:1.5px solid var(--brand-navy-line);border-radius:6px;
    background:linear-gradient(135deg, var(--brand-navy) 0%, var(--brand-navy-deep) 100%);
    box-shadow:0 2px 0 var(--shadow); padding:14px 18px;
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  }
  .masthead .brandmark{display:flex;align-items:center;gap:12px;}
  .coin{height:44px;width:auto;flex:none;display:block;background:#fff;border-radius:6px;padding:3px 5px;}
  .masthead h1{font-size:20px;margin:0;letter-spacing:.2px;color:#ffffff;}
  .masthead .kicker{font-size:11px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;font-weight:700;margin-bottom:2px;}
  .masthead .sub{font-size:12px;color:rgba(255,255,255,.7);margin-top:2px;}
  .masthead .toolbar{display:flex;gap:6px;flex:none;}
  .icon-btn{
    background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.3);border-radius:5px;
    color:#fff;font-size:13px;padding:7px 9px;cursor:pointer;line-height:1;
  }
  .icon-btn:hover{background:rgba(255,255,255,.18);}

  .hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
  @media (max-width:640px){ .hud{grid-template-columns:repeat(2,1fr);} }
  .stamp{border:1.5px solid rgba(0,32,102,.12);border-radius:5px;background:var(--navy-soft);padding:7px 10px;display:flex;flex-direction:column;gap:2px;}
  .stamp .lbl{font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--navy);opacity:.75;font-weight:700;}
  .stamp .val{font-size:16.5px;font-weight:700;color:var(--ink);}
  .meterbar{width:100%;height:6px;border-radius:4px;background:var(--paper-3);overflow:hidden;margin-top:3px;}
  .meterbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--brand-navy-line));}

  .card{border:2px solid var(--line);border-radius:6px;background:var(--paper-2);box-shadow:0 2px 0 var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;}

  /* ---- Intro ---- */
  .intro-modules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px;}
  @media (max-width:640px){ .intro-modules{grid-template-columns:1fr;} }
  .intro-mod{border:1.5px dashed var(--line);border-radius:6px;padding:9px 10px;font-size:12px;color:var(--ink-mute);text-align:center;}
  .intro-mod .im-icon{font-size:20px;}
  .intro-mod b{display:block;color:var(--ink);font-size:12.5px;margin-top:3px;}
  .field{display:flex;flex-direction:column;gap:5px;margin:6px 0;}
  .field label{font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-mute);font-weight:700;}
  .field input[type=text]{background:var(--paper);border:1.5px solid var(--line);border-radius:5px;padding:9px 10px;font-size:14.5px;color:var(--ink);font-family:inherit;}

  .btn{font-weight:700;font-size:14px;letter-spacing:.2px;background:var(--brand-navy);color:#fff;border:1.5px solid var(--brand-navy-line);border-radius:5px;padding:10px 16px;cursor:pointer;}
  .btn:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);}
  .btn.ghost:hover{border-color:var(--navy);color:var(--navy);}
  .btn.small{padding:7px 11px;font-size:12.5px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:none;}

  /* ---- Hub / map ---- */
  .hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:640px){ .hub-grid{grid-template-columns:1fr;} }
  .mod-card{border:2px solid var(--mc,var(--line));border-radius:7px;background:var(--paper);padding:13px 14px;display:flex;flex-direction:column;gap:7px;text-align:left;cursor:pointer;color:var(--ink);}
  .mod-card:hover{box-shadow:0 0 0 3px color-mix(in srgb, var(--mc,var(--line)) 25%, transparent);}
  .mod-card .mc-top{display:flex;align-items:center;gap:9px;}
  .mod-card .mc-icon{font-size:24px;flex:none;}
  .mod-card h3{margin:0;font-size:15px;color:var(--mc,var(--ink));}
  .mod-card p{margin:0;font-size:12px;color:var(--ink-mute);line-height:1.5;}
  .mod-card .mc-progress{margin-top:2px;font-size:11px;color:var(--ink-mute);display:flex;align-items:center;gap:6px;}
  .mod-card .mc-dots{display:flex;gap:4px;}
  .mod-card .mc-dot{width:8px;height:8px;border-radius:50%;background:var(--paper-3);border:1.5px solid var(--mc,var(--line));}
  .mod-card .mc-dot.done{background:var(--mc,var(--line));}
  .mod-card.locked{opacity:.55;cursor:not-allowed;}
  .mod-card.locked:hover{box-shadow:none;}
  .mod-card.complete{background:color-mix(in srgb, var(--mc,var(--line)) 10%, var(--paper));}
  .lock-note{font-size:11px;color:var(--ink-mute);font-style:italic;}

  .overall-bar{font-size:12px;color:var(--ink-mute);display:flex;align-items:center;gap:8px;}
  .overall-bar .meterbar{flex:1;}

  /* ---- Task screen ---- */
  .task-card{border-top:5px solid var(--mc,var(--navy));}
  .task-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .task-head .th-left{display:flex;gap:10px;align-items:center;}
  .task-head .th-icon{font-size:26px;flex:none;}
  .task-head h2{margin:0;font-size:16.5px;color:var(--ink);}
  .task-head .th-mod{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mc,var(--navy));font-weight:800;}
  .pill{font-size:10.5px;font-weight:700;color:var(--ink-mute);background:var(--paper-3);border-radius:999px;padding:4px 9px;flex:none;}
  .prompt{font-size:14.5px;line-height:1.65;}

  .opt-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .opt-btn{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:5px;color:var(--ink);padding:10px 13px;font-size:14px;cursor:pointer;font-family:inherit;}
  .opt-btn:hover{border-color:var(--navy);}
  .opt-btn .opt-detail{display:block;font-size:12px;color:var(--ink-mute);margin-top:3px;line-height:1.5;}
  .opt-btn.chosen-good{border-color:var(--good);background:var(--good-soft);}
  .opt-btn.chosen-bad{border-color:var(--wine);background:var(--wine-soft);}
  .opt-btn.chosen{border-color:var(--navy);background:var(--navy-soft);}
  .opt-btn:disabled{cursor:default;}

  .feedback{margin-top:4px;padding:11px 13px;border-radius:5px;border-left:4px solid var(--good);background:var(--good-soft);font-size:13.5px;line-height:1.6;}
  .feedback.bad{border-color:var(--wine);background:var(--wine-soft);}
  .feedback.info{border-color:var(--navy);background:var(--navy-soft);}
  .feedback b{display:block;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
  .feedback.bad b{color:var(--wine);}
  .feedback:not(.bad):not(.info) b{color:var(--good);}
  .feedback.info b{color:var(--navy);}

  .match-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px;}
  .match-col-title{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--mc,var(--navy));margin-bottom:6px;font-weight:800;}
  .match-item{display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:5px;color:var(--ink);padding:8px 10px;font-size:12.5px;cursor:pointer;margin-bottom:6px;font-family:inherit;line-height:1.4;}
  .match-item:hover{border-color:var(--navy);}
  .match-item.selected{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset;}
  .match-item.done{border-color:var(--good);background:var(--good-soft);cursor:default;opacity:.85;}
  .match-item.wrongflash{border-color:var(--wine);background:var(--wine-soft);}
  .match-item:disabled{cursor:default;}
  .match-score{margin-top:4px;font-size:12px;color:var(--mc,var(--navy));font-weight:700;}

  .chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px;}
  .chip{background:var(--paper);border:1.5px solid var(--line);border-radius:999px;color:var(--ink);padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;line-height:1.3;}
  .chip:hover{border-color:var(--navy);}
  .chip.selected{border-color:var(--navy);background:var(--navy-soft);color:var(--navy);font-weight:700;}

  .alloc-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .alloc-row label{flex:0 0 90px;font-size:12.5px;color:var(--ink);}
  .alloc-row input[type=range]{flex:1;accent-color:var(--navy);}
  .alloc-row .alloc-val{flex:0 0 42px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13.5px;}
  .alloc-total{margin-top:6px;padding:9px 11px;border-radius:5px;background:var(--paper);border:1px solid var(--paper-3);font-size:13.5px;display:flex;justify-content:space-between;}
  .alloc-total.bad{color:var(--wine);border-color:var(--wine);}
  .alloc-total.ok{color:var(--good);border-color:var(--good);}

  .sort-item{border:1.5px solid var(--line);border-radius:6px;background:var(--paper);padding:10px 12px;margin-bottom:9px;}
  .sort-item .si-text{font-size:13.5px;margin-bottom:8px;}
  .sort-item .si-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .sort-item .si-btns button{flex:1;min-width:150px;}
  .sort-item.done{border-color:var(--good);}
  .sort-item .si-note{margin-top:8px;}

  textarea.compose-box{width:100%;min-height:110px;background:var(--paper);border:1.5px solid var(--line);border-radius:5px;padding:10px 11px;font-size:14px;color:var(--ink);font-family:inherit;line-height:1.55;resize:vertical;}
  .wordcount{font-size:11.5px;color:var(--ink-mute);margin-top:4px;}
  .examples{margin-top:4px;padding:11px 13px;border-radius:5px;background:var(--gold-soft);border-left:4px solid var(--gold);font-size:13px;line-height:1.6;}
  .examples b{display:block;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--gold-text);margin-bottom:5px;}
  .examples ul{margin:0;padding-left:18px;}

  .task-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px;}

  .transition-card{text-align:center;padding:26px 18px;}
  .transition-card .tc-icon{font-size:44px;}
  .transition-card h2{margin:10px 0 4px;}
  .transition-card p{color:var(--ink-mute);font-size:13.5px;line-height:1.6;max-width:440px;margin:0 auto 14px;}

  .badge-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0;}
  .badge-chip{border:1.5px solid var(--gold);background:var(--gold-soft);color:var(--gold-text);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;}

  /* ---- Certificate ---- */
  .cert-wrap{border:3px double var(--brand-navy);border-radius:6px;background:var(--paper-2);padding:28px 24px;text-align:center;}
  .cert-wrap .cert-kicker{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold-text);font-weight:800;}
  .cert-wrap h2{margin:6px 0 2px;font-size:23px;}
  .cert-wrap .cert-name{font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:var(--navy);margin:10px 0;border-bottom:1.5px solid var(--paper-3);display:inline-block;padding:0 10px 6px;min-width:220px;}
  .cert-wrap .cert-sub{font-size:12.5px;color:var(--ink-mute);line-height:1.7;max-width:480px;margin:6px auto 14px;}
  .cert-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px;margin:0 auto 14px;}
  .cert-stats .cell{border:1px solid var(--paper-3);border-radius:5px;background:var(--paper);padding:8px 6px;}
  .cert-stats .cell .lbl{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-mute);}
  .cert-stats .cell .val{font-family:'IBM Plex Mono',monospace;font-size:15.5px;font-weight:700;margin-top:2px;}
  .cert-foot{font-size:11px;color:var(--ink-mute);margin-top:14px;letter-spacing:.3px;}

  /* ---- Glossary modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(10,7,3,.6);backdrop-filter:blur(1.5px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:70;}
  .overlay[hidden]{display:none;}
  .modal{width:100%;max-width:420px;max-height:80vh;background:var(--paper-2);border:2px solid var(--line);border-radius:8px;box-shadow:0 10px 0 var(--shadow);display:flex;flex-direction:column;overflow:hidden;}
  .modal-head{padding:12px 16px;border-bottom:1.5px solid var(--paper-3);background:var(--paper-3);display:flex;align-items:center;gap:10px;}
  .modal-head .m-icon{font-size:20px;flex:none;}
  .modal-head h3{margin:0;font-size:15px;color:var(--ink);}
  .modal-head .m-sub{font-size:11px;color:var(--ink-mute);margin-top:1px;}
  .modal-body{padding:14px 16px;overflow-y:auto;font-size:13px;line-height:1.6;}
  .modal-foot{padding:10px 16px;border-top:1.5px solid var(--paper-3);display:flex;justify-content:flex-end;background:var(--paper-3);}
  .gloss-term{margin-bottom:12px;}
  .gloss-term:last-child{margin-bottom:0;}
  .gloss-term dt{font-weight:800;color:var(--navy);font-size:13px;}
  .gloss-term dd{margin:2px 0 0;color:var(--ink);}

  /* ---- Document identify (e.g. a policy schedule) ---- */
  .doc-box{border:1.5px solid var(--line);border-radius:6px;background:var(--paper);overflow:hidden;margin-top:4px;}
  .doc-row{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--paper-3);padding:9px 12px;font-size:13px;color:var(--ink);cursor:pointer;font-family:inherit;}
  .doc-row:last-child{border-bottom:none;}
  .doc-row:hover:not(:disabled){background:var(--navy-soft);}
  .doc-row .doc-lbl{color:var(--ink-mute);}
  .doc-row .doc-val{font-family:'IBM Plex Mono',monospace;font-weight:700;flex:none;text-align:right;}
  .doc-row.correct{background:var(--good-soft);}
  .doc-row.wrongflash{background:var(--wine-soft);}
  .doc-row:disabled{cursor:default;}

  /* ---- Simple two-bar comparison ---- */
  .bar-compare{display:flex;gap:20px;align-items:flex-end;margin:10px 0 4px;height:110px;}
  .bar-compare .bcol{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;height:100%;justify-content:flex-end;}
  .bar-compare .bcol .bar{width:44px;border-radius:4px 4px 0 0;background:var(--paper-3);}
  .bar-compare .bcol.hi .bar{background:linear-gradient(180deg,var(--navy),var(--brand-navy));}
  .bar-compare .bcol .bamt{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:700;}
  .bar-compare .bcol .blbl{font-size:10.5px;color:var(--ink-mute);text-align:center;line-height:1.35;}

  /* ---- Dream bookend ---- */
  .dream-callback{margin-top:6px;padding:11px 13px;border-radius:5px;border-left:4px solid var(--gold);background:var(--gold-soft);font-size:13.5px;line-height:1.6;font-style:italic;}

  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,10px);background:var(--ink);color:var(--paper);border-radius:6px;padding:9px 16px;font-size:13.5px;opacity:0;transition:opacity .25s ease, transform .25s ease;pointer-events:none;z-index:60;box-shadow:0 6px 18px var(--shadow);max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translate(-50%,0);}

  @media print{
    body *{visibility:hidden;}
    #cert-print, #cert-print *{visibility:visible;}
    #cert-print{position:absolute;top:0;left:0;width:100%;}
    .no-print{display:none !important;}
  }
</style>

<div class="wrap">

var MODULES = [
  { id:'A', label:'Money & the Wider World', icon:'🌏', color:'var(--mod-a)', badge:'Big Picture Thinker',
    blurb:'How the economy, global events and your own values shape financial decisions.' },
  { id:'B', label:'Plan It Out', icon:'🗺️', color:'var(--mod-b)', badge:'Planner',
    blurb:'Why financial planning pays off — goals, budgets and staying flexible.' },
  { id:'C', label:'Expect the Unexpected', icon:'🛡️', color:'var(--mod-c)', badge:'Ready for Anything',

/* =========================================================
   DREAM BOOKEND — one no-typing chip-pick on the intro screen,
   echoed once on the certificate next to the student's actual outcome.
   Each choice's outcome() reads live state, so the callback stays true to
   whatever actually happened rather than being fixed text.
========================================================= */
var DREAM_CHOICES = [
  { id:'ready', icon:'🛡️', chip:'Being ready for anything',
    start:'you wanted to feel ready for anything — the unexpected included',
    outcome:function(){
      var pct = clamp(state.resilience,0,100);
      return 'you’re finishing with a resilience score of '+pct+'%'+(state.badges.indexOf('C')!==-1 ? ', and the Ready for Anything badge to show for it' : '')+'.';
    } },
  { id:'goal', icon:'🎯', chip:'Reaching a goal',
    start:'you wanted to make real progress toward a savings goal',
    outcome:function(){
      return 'you’re finishing with '+fmt(state.cash)+' put aside'+(state.badges.indexOf('B')!==-1 ? ', and the Planner badge alongside it' : '')+'.';
    } },
  { id:'whanau', icon:'🤝', chip:'Helping the people around me',
    start:'you wanted to think about how your choices affect the people around you',
    outcome:function(){
      return 'you’ve worked through some real perspectives on money and whānau'+(state.badges.indexOf('A')!==-1 ? ', and picked up the Big Picture Thinker badge along the way' : '')+'.';
    } },
  { id:'understand', icon:'🧠', chip:'Understanding how it all works',
    start:'you just wanted to understand how it all works',
    outcome:function(){
      return 'you’re finishing with '+state.stars+' of '+STAR_MAX+' knowledge stars'+(state.stars===STAR_MAX ? ' — the full set' : '')+'.';
    } }
];
function dreamChoiceById(id){ for(var i=0;i<DREAM_CHOICES.length;i++){ if(DREAM_CHOICES[i].id===id) return DREAM_CHOICES[i]; } return null; }

/* =========================================================
   GLOSSARY — a handful of quick look-ups, reusing wording already
   written elsewhere in the game rather than introducing new definitions.
========================================================= */
var GLOSSARY = [
  { term:'Emergency fund', def:'Money set aside ahead of time for unexpected events, so a surprise cost doesn’t have to turn into a bigger problem.' },
  { term:'Excess', def:'The amount you pay yourself before your insurance covers the rest of a claim.' },
  { term:'ACC', def:'New Zealand’s no-fault accident cover scheme — it applies to anyone injured by accident here, funded by levies on workers, employers and motorists, plus government funding.' },
  { term:'Financial resilience', def:'Being able to cope when something unexpected happens, like the car needing a repair.' },
  { term:'Budget', def:'A plan for the money you expect to receive and how you expect to spend it.' }
];

var TASKS = {

  A:[
    { id:'a1', kind:'match', icon:'📈', title:'Boom or bust?',
      prompt:'The economy moves through cycles of growth and downturn — and that ripples out into everyday life. Match each situation to what it tends to mean for people.',
      pairs:[
        { term:'The economy is growing', def:'Businesses are hiring, wages may rise, and people tend to spend more' },
        { term:'The economy is in a downturn', def:'Businesses cut back, jobs are harder to find, and people tend to spend less' },
        { term:'Prices rise faster than wages (inflation)', def:'The same pay buys less than it used to' },
        { term:'A major export price falls on world markets', def:'New Zealand exporters earn less — which can flow through to jobs at home' }
      ],
      afterNote:'Growth and downturns aren’t random — they shift prices, wages and jobs, which is exactly why financial decisions that made sense last year might need a rethink this year.',
      reward:{cash:8,resilience:4} },

    { id:'a2', kind:'mcq', icon:'🌏', title:'Bread, but overseas',
      prompt:'A drought on the other side of the world pushes up the global price of wheat. A few weeks later, bread and pasta cost more at your local supermarket.',
      questions:[
        { q:'What’s the best way to think about this?',
          options:[
            { text:'It’s a coincidence — what happens overseas doesn’t really affect us here.', correct:false,
              feedback:'Not quite. Being part of global markets means events far away really can reach the supermarket shelf here.' },
            { text:'New Zealand is part of global markets, so events overseas — like a bad harvest — can affect prices, jobs and choices here at home.', correct:true,
              feedback:'Exactly. Because New Zealand trades with the rest of the world, what happens overseas can show up in our cost of living, even when we had nothing to do with it.' },
            { text:'It only matters to people who buy imported food.', correct:false,
              feedback:'It reaches further than that — flow-on costs (like the price of animal feed) can push up all sorts of everyday prices, not just imports.' }
          ] }
      ],
      afterNote:'Being connected to global markets cuts both ways — it can bring lower prices and more choice, but it also means costs and job opportunities here can shift because of decisions made somewhere else entirely.',

      note:'There’s no “normal” set of answers here. Your own life experiences, values and responsibilities all shape the financial choices that feel right to you — and they’ll keep shifting as your life does.',

      prompt:'Different people use money in different, equally valid ways. Match each person to the choice that fits their situation.',

        { term:'Amiria helps pay for kai for her whānau most weeks', def:'Puts a regular share of her pay toward the grocery shop' },
        { term:'Jayden has wanted a guitar for a year and has just enough saved', def:'Skips extras for a few weeks to finally hit his savings goal' },
        { term:'Mia feels strongly about supporting a cause she cares about', def:'Sets aside a small, regular amount to give or donate' },
        { term:'Tama is often the one who helps out if things are tight at home', def:'Keeps some money aside in case family need a hand' }
      ],
      afterNote:'None of these choices is more “correct” than another — they make sense once you know each person’s circumstances, values and responsibilities. Recognising that people use money differently is part of understanding financial wellbeing for everyone, not just yourself.',
      reward:{cash:8,resilience:4} }
  ],

  B:[
    { id:'b1', kind:'match', icon:'💡', title:'Why plan?',
      prompt:'Financial planning has real benefits beyond “having more money”. Match each benefit to an example of it in action.',

var STAR_MAX = 4; /* a2(1) + b4(1) + c3(2) */
var BADGE_MAX = 5; /* one per module (A/B/C/W) plus the "All Sorted" master badge */

/* =========================================================
   STATE
========================================================= */
var SAVE_KEY = 'moneymap_whs_y9_v1';

function defaultState(){
  return {
    screen:'intro', name:'', dreamChoice:null,
    activeModule:null, activeTaskIndex:0,
    cash:80, resilience:50, stars:0,
    completedTasks:{}, badges:[],
    transitionModule:null
  };
}
var state = load() || defaultState();

function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
function load(){ try{ var raw = localStorage.getItem(SAVE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function fmt(n){ n = Math.round(n); return (n<0?'-$':'$') + Math.abs(n).toLocaleString('en-NZ'); }

/* Small two-bar SVG comparison (e.g. a piggy bank vs. a fund earning
   interest) — a hoisted function declaration so task data defined above it
   in the file can still call it when TASKS is built. */
function savingsCompareBars(caption, aLabel, aAmount, bLabel, bAmount){
  var maxAmt = Math.max(aAmount, bAmount);
  var aH = Math.max(10, Math.round(aAmount/maxAmt*90));
  var bH = Math.max(10, Math.round(bAmount/maxAmt*90));
  var html = '<div class="bar-compare">';
  html += '<div class="bcol"><div class="bamt num">'+fmt(aAmount)+'</div><div class="bar" style="height:'+aH+'px;"></div><div class="blbl">'+aLabel+'</div></div>';
  html += '<div class="bcol hi"><div class="bamt num">'+fmt(bAmount)+'</div><div class="bar" style="height:'+bH+'px;"></div><div class="blbl">'+bLabel+'</div></div>';
  html += '</div>';
  if(caption) html += '<div class="feedback info" style="margin-top:6px;"><b>Same weekly amount, two destinations</b>'+caption+'</div>';
  return html;
}
function $(id){ return document.getElementById(id); }

function moduleById(id){ for(var i=0;i<MODULES.length;i++){ if(MODULES[i].id===id) return MODULES[i]; } return null; }

function tasksDoneCount(modId){
  var list = TASKS[modId], n = 0;
  for(var i=0;i<list.length;i++){ if(state.completedTasks[list[i].id]) n++; }
  return n;
}
function moduleComplete(modId){ return tasksDoneCount(modId) === TASKS[modId].length; }
function moduleUnlocked(mod){
  if(!mod.requires) return true;
  for(var i=0;i<mod.requires.length;i++){ if(!moduleComplete(mod.requires[i])) return false; }
  return true;
}
function awardBadge(modId){
  var mod = moduleById(modId);
  if(state.badges.indexOf(modId) === -1){
    state.badges.push(modId);
    toast('🏅 Badge earned — ' + mod.badge + '!');
  }
}
function totalTaskCount(){
  var n = 0; for(var k in TASKS){ n += TASKS[k].length; } return n;
}
function totalDoneCount(){
  var n = 0; for(var k in state.completedTasks){ if(state.completedTasks[k]) n++; } return n;
}

var toastTimer = null;
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

/* =========================================================
   HUD
========================================================= */
function renderHUD(){
  var html = '';
  html += '<div class="stamp"><div class="lbl">Savings</div><div class="val num">'+fmt(state.cash)+'</div></div>';
  html += '<div class="stamp"><div class="lbl">Resilience</div><div class="val num">'+clamp(state.resilience,0,100)+'%</div><div class="meterbar"><i style="width:'+clamp(state.resilience,0,100)+'%"></i></div></div>';
  html += '<div class="stamp"><div class="lbl">Knowledge stars</div><div class="val num">'+state.stars+' / '+STAR_MAX+'</div></div>';
  /* Counts the 4 module badges plus the "All Sorted" master badge, out of
     the same 5-badge total shown on the certificate — kept in sync so the
     two screens never disagree about how many badges exist. */
  html += '<div class="stamp"><div class="lbl">Badges</div><div class="val num">'+state.badges.length+' / '+BADGE_MAX+'</div></div>';
  $('hud').innerHTML = html;
}

/* =========================================================
   TOP-LEVEL RENDER
========================================================= */
function renderApp(){
  save();
  renderHUD();
  var app = $('app');
  if(state.screen === 'intro'){ app.innerHTML = ''; renderIntro(app); }
  else if(state.screen === 'hub'){ app.innerHTML = ''; renderHub(app); }
  else if(state.screen === 'task'){ app.innerHTML = ''; renderTaskScreen(app); }
  else if(state.screen === 'transition'){ app.innerHTML = ''; renderTransition(app); }
  else if(state.screen === 'certificate'){ app.innerHTML = ''; renderCertificate(app); }
}

function renderIntro(app){
  var card = document.createElement('div');
  card.className = 'card';
  var html = '<h2 style="margin:0;">Welcome to Money Map</h2>';
  html += '<p class="prompt">You’re about to make a bunch of everyday money decisions — some about the world around you, some about planning ahead, and some about the unexpected. There’s no single path through this: work through the three areas below in <b>any order you like</b>, then wrap up by sharing what you’ve learned.</p>';
  html += '<div class="intro-modules">';
  MODULES.slice(0,3).forEach(function(m){
    html += '<div class="intro-mod" style="border-color:'+m.color+';"><div class="im-icon">'+m.icon+'</div><b>'+m.label+'</b></div>';
  });
  html += '</div>';
  html += '<div class="field"><label>Right now, what matters most to you with money?</label><div class="chip-row" id="dream-row">';
  DREAM_CHOICES.forEach(function(d){
    html += '<button class="chip'+(state.dreamChoice===d.id?' selected':'')+'" data-id="'+d.id+'">'+d.icon+' '+d.chip+'</button>';
  });
  html += '</div></div>';
  html += '<div class="field"><label for="name-input">Your name (optional, for your certificate)</label><input type="text" id="name-input" maxlength="40" value="'+escapeHtml(state.name||'')+'" placeholder="e.g. Alex"></div>';
  html += '<button class="btn" id="start-btn" style="align-self:flex-start;" '+(state.dreamChoice?'':'disabled')+'>Start exploring →</button>';
  card.innerHTML = html;
  app.appendChild(card);
  $('name-input').addEventListener('input', function(){ state.name = this.value; save(); });
  Array.prototype.forEach.call(document.querySelectorAll('#dream-row .chip'), function(btn){
    btn.addEventListener('click', function(){
      state.dreamChoice = btn.getAttribute('data-id');
      save();
      Array.prototype.forEach.call(document.querySelectorAll('#dream-row .chip'), function(b){ b.classList.remove('selected'); });
      btn.classList.add('selected');
      $('start-btn').disabled = false;
    });
  });
  $('start-btn').addEventListener('click', function(){ if(!state.dreamChoice) return; state.screen = 'hub'; renderApp(); });
}

function renderHub(app){
  var card = document.createElement('div');
  card.className = 'card';
  var doneAll = totalDoneCount(), totAll = totalTaskCount();
  var html = '<h2 style="margin:0;">Your money map</h2>';
  html += '<div class="overall-bar">Overall progress: <span class="num">'+doneAll+' / '+totAll+'</span><div class="meterbar"><i style="width:'+Math.round(doneAll/totAll*100)+'%"></i></div></div>';
  html += '<div class="hub-grid" id="hub-grid"></div>';
  card.innerHTML = html;
  app.appendChild(card);

  var grid = $('hub-grid');
  MODULES.forEach(function(m){
    var unlocked = moduleUnlocked(m);
    var done = tasksDoneCount(m.id), total = TASKS[m.id].length, complete = done===total;
    var el = document.createElement(unlocked ? 'button' : 'div');
    el.className = 'mod-card' + (unlocked?'':' locked') + (complete?' complete':'');
    el.style.setProperty('--mc', m.color);
    var dots = '';
    for(var i=0;i<total;i++){ dots += '<span class="mc-dot'+(i<done?' done':'')+'"></span>'; }
    var inner = '<div class="mc-top"><div class="mc-icon">'+m.icon+'</div><div><h3>'+m.label+'</h3></div></div>';
    inner += '<p>'+m.blurb+'</p>';
    if(unlocked){
      inner += '<div class="mc-progress"><span class="mc-dots">'+dots+'</span> '+done+' / '+total+' done'+(complete?' · Badge earned 🏅':'')+'</div>';
    } else {
      inner += '<div class="lock-note">🔒 Unlocks after Money &amp; the Wider World, Plan It Out, and Expect the Unexpected are all complete.</div>';
    }
    el.innerHTML = inner;
    if(unlocked){
      el.addEventListener('click', function(modId){ return function(){
        state.activeModule = modId;
        state.activeTaskIndex = firstIncompleteIndex(modId);
        state.screen = 'task';
        renderApp();
      };}(m.id));
    }
    grid.appendChild(el);
  });

  if(state.badges.length > 0){
    var br = document.createElement('div');
    br.className = 'badge-row';
    /* Walk MODULES rather than state.badges directly — state.badges can
       also hold the 'MASTER' entry, which isn't a module id and has no
       moduleById() match. */
    MODULES.forEach(function(m){
      if(state.badges.indexOf(m.id) !== -1){ br.innerHTML += '<span class="badge-chip">🏅 '+m.badge+'</span>'; }
    });
    if(state.badges.indexOf('MASTER') !== -1){ br.innerHTML += '<span class="badge-chip">🏆 All Sorted</span>'; }
    app.appendChild(br);
  }
}

function firstIncompleteIndex(modId){
  var list = TASKS[modId];
  for(var i=0;i<list.length;i++){ if(!state.completedTasks[list[i].id]) return i; }
  return 0;
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* =========================================================
   TASK SCREEN (dispatch by kind)
========================================================= */
function renderTaskScreen(app){
  var mod = moduleById(state.activeModule);
  var list = TASKS[mod.id];
  var task = list[state.activeTaskIndex];

  var card = document.createElement('div');
  card.className = 'card task-card';
  card.style.setProperty('--mc', mod.color);

  var already = !!state.completedTasks[task.id];

  var head = '<div class="task-head"><div class="th-left"><div class="th-icon">'+task.icon+'</div><div><div class="th-mod">'+mod.icon+' '+mod.label+'</div><h2>'+task.title+'</h2></div></div><div class="pill">Task '+(state.activeTaskIndex+1)+' of '+list.length+'</div></div>';
  head += '<p class="prompt">'+task.prompt+'</p>';
  /* Revisiting a completed task re-shuffles matches and clears any typed
     answer rather than restoring what was submitted before — this banner
     is upfront about that instead of quietly pretending it's the first go. */
  if(already){
    head += '<div class="feedback info"><b>Already completed</b>You’ve done this one before — your badge and stats are safe either way. Feel free to redo it as a recap, though matches will re-shuffle and any writing won’t be saved from last time.</div>';
  }
  var body = '<div id="task-body"></div>';
  var foot = '<div class="task-foot"><button class="btn ghost small" id="back-hub-btn">← Back to map</button><div id="task-foot-right"></div></div>';

  card.innerHTML = head + body + foot;
  app.appendChild(card);

  $('back-hub-btn').addEventListener('click', function(){ state.screen = 'hub'; renderApp(); });

  if(task.kind === 'match') renderMatchKind(task, mod, already);
  else if(task.kind === 'mcq') renderMcqKind(task, mod, already);
  else if(task.kind === 'reflect') renderReflectKind(task, mod, already);
  else if(task.kind === 'allocate') renderAllocateKind(task, mod, already);
  else if(task.kind === 'tiered') renderTieredKind(task, mod, already);
  else if(task.kind === 'decision') renderDecisionKind(task, mod, already);
  else if(task.kind === 'sort') renderSortKind(task, mod, already);
  else if(task.kind === 'compose') renderComposeKind(task, mod, already);
  else if(task.kind === 'identify') renderIdentifyKind(task, mod, already);
}

function showContinue(task, mod){
  var right = $('task-foot-right');
  var btn = document.createElement('button');
  btn.className = 'btn small';
  btn.textContent = 'Continue';
  btn.addEventListener('click', function(){ finishTask(task, mod); });
  right.innerHTML = '';
  right.appendChild(btn);
}

function applyReward(reward){
  if(!reward) return;
  if(reward.cash) state.cash = clamp(state.cash + reward.cash, 0, 999999);
  if(reward.resilience) state.resilience = clamp(state.resilience + reward.resilience, 0, 100);
}

function finishTask(task, mod){
  var wasComplete = !!state.completedTasks[task.id];
  state.completedTasks[task.id] = true;
  save();
  if(moduleComplete(mod.id)){
    if(!wasComplete){
      awardBadge(mod.id);
      checkMasterBadge();
    }
    if(mod.id === 'W'){
      state.screen = 'certificate';
      renderApp();
      return;
    }
    state.screen = 'transition';
    state.transitionModule = mod.id;
    renderApp();
    return;
  }
  /* More tasks left in this module — move straight on to the next one
     instead of bouncing back to the map every time. */
  var nextIdx = firstIncompleteIndex(mod.id);
  state.activeTaskIndex = nextIdx;
  state.screen = 'task';
  renderApp();
}

function checkMasterBadge(){
  var need = ['A','B','C','W'];
  var all = true;
  for(var i=0;i<need.length;i++){ if(state.badges.indexOf(need[i])===-1) all = false; }
  if(all && state.badges.indexOf('MASTER')===-1){
    state.badges.push('MASTER');
    toast('🏆 All sorted! You’ve earned every badge on the map.');
  }
}

function renderTransition(app){
  var mod = moduleById(state.transitionModule);
  var card = document.createElement('div');
  card.className = 'card transition-card';
  var html = '<div class="tc-icon">'+mod.icon+'</div>';
  html += '<h2>'+mod.label+' — complete!</h2>';
  html += '<p>You’ve earned the <b>'+mod.badge+'</b> badge.</p>';
  html += '<button class="btn" id="back-hub-btn2">Back to the map →</button>';
  card.innerHTML = html;
  app.appendChild(card);
  $('back-hub-btn2').addEventListener('click', function(){ state.screen='hub'; renderApp(); });
}

  });
  html += '</div><div id="fb"></div>';

/* ---------------- MCQ (one or more sequential questions) ---------------- */
function renderMcqKind(task, mod, already){
  var qi = 0, correctCount = 0;
  var body = $('task-body');

  function renderQ(){
    var q = task.questions[qi];
    var html = '<div class="pill" style="margin-bottom:8px;">Question '+(qi+1)+' of '+task.questions.length+'</div>';
    html += '<div style="font-weight:700;font-size:14px;margin-bottom:6px;">'+q.q+'</div>';
    html += '<div class="opt-list" id="opt-list">';
    q.options.forEach(function(o,i){ html += '<button class="opt-btn" data-i="'+i+'">'+o.text+'</button>'; });
    html += '</div><div id="fb"></div>';
    body.innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll('#opt-list .opt-btn'), function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(btn.getAttribute('data-i'),10);
        var opt = q.options[i];
        Array.prototype.forEach.call(document.querySelectorAll('#opt-list .opt-btn'), function(b){ b.disabled = true; });
        btn.classList.add(opt.correct ? 'chosen-good' : 'chosen-bad');
        if(opt.correct) correctCount++;
        $('fb').innerHTML = '<div class="feedback '+(opt.correct?'':'bad')+'"><b>'+(opt.correct?'Nice work':'Worth a rethink')+'</b>'+opt.feedback+'</div>';
        var right = $('task-foot-right');
        var btn2 = document.createElement('button');
        btn2.className = 'btn small';
        if(qi < task.questions.length-1){
          btn2.textContent = 'Next question →';
          btn2.addEventListener('click', function(){ qi++; renderQ(); });
        } else {
          btn2.textContent = 'Continue';
          btn2.addEventListener('click', function(){
            if(!already){ state.stars = clamp(state.stars + correctCount, 0, STAR_MAX); applyReward(task.reward); }
            renderHUD();
            if(task.afterNote){ $('fb').innerHTML += '<div class="feedback info" style="margin-top:8px;"><b>Worth remembering</b>'+task.afterNote+'</div>'; }
            finishTask(task, mod);
          });
        }
        right.innerHTML = ''; right.appendChild(btn2);
      });
    });
  }
  renderQ();
}

/* ---------------- MATCH ---------------- */
function renderMatchKind(task, mod, already){
  var terms = task.pairs.map(function(p,i){ return {i:i, text:p.term}; });
  var defs = task.pairs.map(function(p,i){ return {i:i, text:p.def}; });
  function shuffle(arr){ for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return arr; }
  shuffle(terms); shuffle(defs);

  var body = $('task-body');
  var html = '<div class="match-cols">';
  html += '<div><div class="match-col-title">Situation</div>'+terms.map(function(t){ return '<button class="match-item" data-side="term" data-i="'+t.i+'">'+t.text+'</button>'; }).join('')+'</div>';
  html += '<div><div class="match-col-title">Match</div>'+defs.map(function(d){ return '<button class="match-item" data-side="def" data-i="'+d.i+'">'+d.text+'</button>'; }).join('')+'</div>';
  html += '</div><div class="match-score" id="match-score">Matched 0 of '+task.pairs.length+'</div><div id="fb"></div>';
  body.innerHTML = html;
  body.querySelector('.match-col-title').parentElement.style.setProperty('--mc', mod.color);

  var selectedTerm = null, matched = 0;
  Array.prototype.forEach.call(document.querySelectorAll('.match-item'), function(btn){
    btn.addEventListener('click', function(){
      var side = btn.getAttribute('data-side');
      var i = parseInt(btn.getAttribute('data-i'),10);
      if(side==='term'){
        Array.prototype.forEach.call(document.querySelectorAll('.match-item[data-side="term"]'), function(b){ b.classList.remove('selected'); });
        btn.classList.add('selected');
        selectedTerm = i;
      } else {
        if(selectedTerm===null) return;
        if(selectedTerm===i){
          matched++;
          document.querySelector('.match-item[data-side="term"][data-i="'+i+'"]').classList.add('done');
          document.querySelector('.match-item[data-side="term"][data-i="'+i+'"]').disabled = true;
          btn.classList.add('done'); btn.disabled = true;
          selectedTerm = null;
          $('match-score').textContent = 'Matched '+matched+' of '+task.pairs.length;
          if(matched === task.pairs.length){
            if(!already) applyReward(task.reward);
            renderHUD();
            var fb = task.afterNote ? '<div class="feedback info"><b>Worth remembering</b>'+task.afterNote+'</div>' : '';
            /* Optional extra visual (e.g. a comparison chart) shown once the
               match is solved, alongside the usual afterNote. */
            if(task.extraHtml) fb += task.extraHtml;
            $('fb').innerHTML = fb;
            showContinue(task, mod);
          }
        } else {
          btn.classList.add('wrongflash');
          setTimeout(function(){ btn.classList.remove('wrongflash'); }, 400);
          Array.prototype.forEach.call(document.querySelectorAll('.match-item[data-side="term"]'), function(b){ b.classList.remove('selected'); });
          selectedTerm = null;
        }
      }
    });
  });
}

function renderReflectKind(task, mod, already){
  var body = $('task-body');

}

/* ---------------- ALLOCATE ---------------- */
function renderAllocateKind(task, mod, already){
  var body = $('task-body');
  var html = '<div id="alloc-rows">';
  task.categories.forEach(function(c){
    html += '<div class="alloc-row"><label for="al-'+c.id+'">'+c.label+'</label><input type="range" min="0" max="100" value="'+c.def+'" id="al-'+c.id+'"><span class="alloc-val num" id="alv-'+c.id+'">'+c.def+'%</span></div>';
  });
  html += '</div><div class="alloc-total" id="alloc-total">Total: <span class="num" id="alloc-total-val">100</span>%</div><div id="fb"></div>';
  body.innerHTML = html;

  function recalc(){
    var total = 0;
    task.categories.forEach(function(c){ total += parseInt($('al-'+c.id).value,10); });
    $('alloc-total-val').textContent = total;
    var box = $('alloc-total');
    box.className = 'alloc-total ' + (total===100?'ok':'bad');
    return total;
  }
  task.categories.forEach(function(c){
    $('al-'+c.id).addEventListener('input', function(){ $('alv-'+c.id).textContent = this.value+'%'; recalc(); });
  });
  recalc();

  var right = $('task-foot-right');
  right.innerHTML = '<button class="btn small" id="alloc-submit">Set my budget</button>';
  $('alloc-submit').addEventListener('click', function(){
    var total = recalc();
    if(total !== 100){ toast('Your split needs to add up to exactly 100%.'); return; }
    var needs = parseInt($('al-needs').value,10), savings = parseInt($('al-savings').value,10), wants = parseInt($('al-wants').value,10);
    /* "Healthy" needs all three guardrails at once — needs and savings each
       covered AND wants not left free to swallow whatever's left over.
       Without the wants cap, a 30/10/60/0 split (needs+savings technically
       met, but everything else dumped into wants) would wrongly pass. */
    var good = needs >= 30 && savings >= 10 && wants <= 50;
    var reward = good ? {cash:15,resilience:5} : {cash:5,resilience:2};
    if(!already) applyReward(reward);
    renderHUD();
    var fb;
    if(good){ fb = '<div class="feedback"><b>A healthy split</b>Needs are covered and you’re putting a real share toward savings, without wants crowding everything else out. There’s no single “correct” budget, but keeping all three of those in balance gives you room to handle surprises.</div>'; }
    else if(wants > 50){ fb = '<div class="feedback info"><b>Wants are taking over</b>Over half your budget is going to wants — even if needs and savings look okay on paper, a split this lopsided leaves little room for anything else. Try pulling wants back a bit.</div>'; }
    else { fb = '<div class="feedback info"><b>A workable split</b>This covers the basics, but with lower needs or savings shares there’s less of a buffer if something unexpected comes up. There’s no single right budget — it’s worth revisiting this as your income or costs change.</div>'; }
    if(task.afterNote) fb += '<div class="feedback info" style="margin-top:8px;"><b>Worth remembering</b>'+task.afterNote+'</div>';
    $('fb').innerHTML = fb;
    $('alloc-submit').disabled = true;
    showContinue(task, mod);
  });
}

/* Optional third micro-step: a purely narrative "where does this land"
   choice layered on top of a reward that's already been applied — it makes
   the win feel like a real decision without tracking any new stats. */
function renderRewardChoiceStep(task, mod){
  var rc = task.rewardChoice;

  var html = '<div style="font-weight:700;font-size:12.5px;margin-bottom:4px;">'+rc.prompt+'</div><div class="opt-list" id="rewardchoice-list">';
  rc.options.forEach(function(o,i){ html += '<button class="opt-btn" data-i="'+i+'"><b>'+o.label+'</b></button>'; });
  html += '</div><div id="rewardchoice-fb"></div>';
  wrap.innerHTML = html;
  $('fb').appendChild(wrap);
  Array.prototype.forEach.call(document.querySelectorAll('#rewardchoice-list .opt-btn'), function(btn){
    btn.addEventListener('click', function(){
      var i = parseInt(btn.getAttribute('data-i'),10);
      Array.prototype.forEach.call(document.querySelectorAll('#rewardchoice-list .opt-btn'), function(b){ b.disabled = true; });
      btn.classList.add('chosen');
      $('rewardchoice-fb').innerHTML = '<div class="feedback info">'+rc.options[i].note+'</div>';
      showContinue(task, mod);
    });
  });
}
function renderEventStep(task, mod, tier, already){
  var step2 = $('tier-step2');
  var res = task.tierResolutions[tier.id];
  var html = '<div class="feedback info" style="margin-top:10px;"><b>A little later…</b>'+task.eventText+'</div>';
  step2.innerHTML = html;
  if(!already) applyReward(res.effect);
  renderHUD();
  var fb = '<div class="feedback"><b>What it cost you</b>You paid '+fmt(res.pay)+'. '+res.feedback+'</div>';
  if(task.afterNote) fb += '<div class="feedback info" style="margin-top:8px;"><b>Worth remembering</b>'+task.afterNote+'</div>';
  $('fb').innerHTML = fb;

}

/* ---------------- SORT ---------------- */
function renderSortKind(task, mod, already){
  var body = $('task-body');
  /* Labels live on the task data (with a sensible fallback) so a future
     sort task isn't stuck reusing this one's "emergency fund" wording. */
  var labels = task.sortLabels || {yes:'Yes', no:'No'};
  var html = '';
  task.items.forEach(function(it,i){
    html += '<div class="sort-item" id="sort-'+i+'"><div class="si-text">'+it.text+'</div><div class="si-btns">';
    html += '<button class="btn ghost small" data-i="'+i+'" data-v="yes">'+labels.yes+'</button>';
    html += '<button class="btn ghost small" data-i="'+i+'" data-v="no">'+labels.no+'</button>';
    html += '</div></div>';
  });
  html += '<div class="match-score" id="sort-score">Rated 0 of '+task.items.length+'</div>';

  Array.prototype.forEach.call(document.querySelectorAll('.sort-item button'), function(btn){

      item.classList.add('done');

      note.className = 'feedback info si-note';

      item.appendChild(note);

/* ---------------- IDENTIFY (click the answer inside a mock document) ---------------- */
function renderIdentifyKind(task, mod, already){

  function renderDoc(){

    task.doc.forEach(function(f){

    });

    return html;
  }

  function renderQ(){

    var html = '<div class="pill" style="margin-bottom:8px;">Question '+(qi+1)+' of '+task.questions.length+'</div>';
    html += '<div style="font-weight:700;font-size:14px;margin-bottom:8px;">'+q.q+'</div>';

}

/* =========================================================
   CERTIFICATE
========================================================= */

  var dateStr = new Date().toLocaleDateString('en-NZ', {day:'numeric', month:'long', year:'numeric'});
  var html = '<div class="cert-wrap" id="cert-print">';

  html += '<h2>Money Map</h2>';
  html += '<div class="cert-name">'+(state.name ? escapeHtml(state.name) : 'A Year 9 student')+'</div>';
  html += '<p class="cert-sub">has worked through Money &amp; the Wider World, Plan It Out, and Expect the Unexpected — making informed financial decisions, planning ahead, and thinking through how to manage the unexpected.</p>';
  var dream = state.dreamChoice ? dreamChoiceById(state.dreamChoice) : null;
  if(dream){
    html += '<div class="dream-callback">Back at the start, '+dream.start+'. Now, '+dream.outcome()+'</div>';
  }
  html += '<div class="cert-stats"><div class="cell"><div class="lbl">Resilience</div><div class="val">'+clamp(state.resilience,0,100)+'%</div></div><div class="cell"><div class="lbl">Knowledge stars</div><div class="val">'+state.stars+'/'+STAR_MAX+'</div></div><div class="cell"><div class="lbl">Badges</div><div class="val">'+state.badges.length+'/'+BADGE_MAX+'</div></div></div>';
  var br = '<div class="badge-row">';
  MODULES.forEach(function(m){ if(state.badges.indexOf(m.id)!==-1){ br += '<span class="badge-chip">'+m.icon+' '+m.badge+'</span>'; } });
  if(state.badges.indexOf('MASTER')!==-1){ br += '<span class="badge-chip">🏆 All Sorted</span>'; }
  br += '</div>';
  html += br;
  html += '<div class="cert-foot">Waiheke High School · Year 9 Financial Literacy · '+dateStr+'</div>';
  html += '</div>';
  html += '<div class="task-foot no-print" style="margin-top:14px;"><button class="btn ghost small" id="back-hub-btn3">← Back to map</button><button class="btn small" id="print-btn">🖨️ Print / save certificate</button></div>';
  card.innerHTML = html;
  app.appendChild(card);
  $('back-hub-btn3').addEventListener('click', function(){ state.screen='hub'; renderApp(); });
  $('print-btn').addEventListener('click', function(){ window.print(); });
}

function syncTheme(){
  var t = null;
  try{ t = localStorage.getItem('moneymap_theme'); }catch(e){}
  if(t) document.documentElement.setAttribute('data-theme', t);
}
document.addEventListener('DOMContentLoaded', function(){
  syncTheme();
  $('theme-btn').addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : (cur === 'light' ? null : 'dark');
    if(next) document.documentElement.setAttribute('data-theme', next);
    else document.documentElement.removeAttribute('data-theme');
    try{ localStorage.setItem('moneymap_theme', next || ''); }catch(e){}
  });
  $('restart-btn').addEventListener('click', function(){
    if(confirm('Start over from the beginning? This clears your progress on this device.')){
      state = defaultState();
      save();
      renderApp();
    }
  });
  $('glossary-btn').addEventListener('click', function(){
    var html = '';
    GLOSSARY.forEach(function(g){ html += '<div class="gloss-term"><dt>'+g.term+'</dt><dd>'+g.def+'</dd></div>'; });
    $('glossary-body').innerHTML = html;
    $('glossary-overlay').hidden = false;
  });
  $('glossary-close').addEventListener('click', function(){ $('glossary-overlay').hidden = true; });
  $('glossary-overlay').addEventListener('click', function(e){ if(e.target.id === 'glossary-overlay') $('glossary-overlay').hidden = true; });
  renderApp();
});
</script>
